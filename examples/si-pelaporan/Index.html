  <!-- CDN Dependencies -->
  <script src="https://cdn.tailwindcss.com"></script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <!-- Library Fitur Opsional (Chart.js & SheetJS) -->

<body>
  <div id="app" v-cloak>

               :is-processing="isProcessing"

               :instansi="'Pemerintah Kabupaten Trenggalek'"
               @login="goToPlatform">
    </app-login>

    <!-- ===== 2. SHELL UTAMA APLIKASI ===== -->
    <div v-if="token" class="flex h-screen overflow-hidden bg-slate-100 dark:bg-slate-900">
      <!-- Sidebar Navigasi -->
      <app-sidebar :collapsed="sidebarCollapsed"
                   :mobile-open="sidebarMobileOpen"
                   :dark="isDarkMode"

                   @close="sidebarMobileOpen = false"
                   @logout="logout">

      <!-- Area Konten Utama -->
      <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
        <!-- Header Universal -->
        <div class="px-4 sm:px-6 pt-4 shrink-0">
          <app-header :dark="isDarkMode"
                      :app-title="appTitle"

                      @toggle-dark="toggleDarkMode"
                      @toggle-mobile="sidebarMobileOpen = !sidebarMobileOpen"
                      @navigate="navigateTo">
          </app-header>
        </div>

        <!-- Konten Halaman Modular -->
        <main class="flex-1 overflow-y-auto px-4 sm:px-6 py-4 space-y-6">

          <!-- Partial Halaman A4: Dashboard -->
          <?!= include('A4_Dashboard'); ?>

          <!-- Partial Halaman A5: Pelaporan -->
          <?!= include('A5_Pelaporan'); ?>

          <!-- Partial Halaman A6: Analisa -->
          <?!= include('A6_Analisa'); ?>

          <!-- Partial Halaman A8: Master Data (Referensi SIMPEG) -->
          <?!= include('A8_MasterData'); ?>

          <!-- Modul Mandiri CDN: Profil SIMPEG -->
          <app-profile v-if="currentPage === 'profil'"></app-profile>

        </main>
      </div>

    <!-- Toast Notifications Universal -->
    <div class="toast-container">
      <div v-for="t in toasts" :key="t.id" class="toast-item" :class="'toast-'+t.type">
        <span class="flex-1">{{ t.message }}</span>
      </div>
    </div>
  </div>

  <!-- 2. FRONTEND CDN SHARED JAVASCRIPT (v2.2.5) -->
  <script src="https://cdn.jsdelivr.net/gh/miftachurrochim82-sketch/frontend-cdn@v2.2.5/frontend/app-components.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/miftachurrochim82-sketch/frontend-cdn@v2.2.5/frontend/app-modules.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/miftachurrochim82-sketch/frontend-cdn@v2.2.5/frontend/app-core.min.js"></script>

  <!-- Inisialisasi SI-PELAPORAN via AppCore -->
  <script>
    /* =========================================================
       Mixin khas SI-PELAPORAN: data & method halaman lokal.
       Auth/shell/toast/callServer disediakan AppCore.
       ========================================================= */
    const SIPelaporanMixin = {
      data() {
        return {
          // Modal Panduan Aplikasi (pengganti menu Tentang)
          showPanduan: false,

          // Dashboard & referensi SIMPEG
          dashboardData: {},
          pegawaiList: [],
          unitList: [],
          jabatanList: [],
          _chartPegawaiUnit: null,
          _chartStatusJabatan: null,

          // Jenis laporan (selaras config jenis_laporan_list di setupApp)
          jenisLaporanList: ['rutin', 'insidental', 'khusus', 'pengawasan'],

          // Pelaporan (CRUD entitas PELAPORAN)
          pelaporanList: [],
          pelaporanPage: 1,
          pelaporanTotalPages: 1,
          pelaporanTotalData: 0,
          pelaporanSearch: '',
          pelaporanFilterStatus: '',
          pelaporanFilterPegawai: '',
          pelaporanFilterJenis: '',
          pelaporanLoading: false,
          pelaporanSaving: false,
          showPelaporanForm: false,
          pelaporanForm: {
            id: '',
            pegawai_id: '',
            tanggal: '',
            jenis_laporan: 'rutin',
            judul: '',
            isi: ''
          },

          // Analisa
          analisaData: null,
          analisaLoading: false,
          analisaTahun: '',
          analisaBulan: '',
          tahunList: [],
          bulanList: [],

          // Master Data referensi (tab)
          activeMasterTab: 'pegawai',
          pegawaiSearch: '',
          unitSearch: '',
          jabatanSearch: '',
          pegawaiRefPage: 1,
          unitRefPage: 1,
          jabatanRefPage: 1,
        };
      },

      computed: {
        // Top unit berdasarkan jumlah pegawai
        pegawaiPerUnitTop() {
          if (!this.pegawaiList.length || !this.unitList.length) return [];
          const counts = {};
          this.pegawaiList.forEach(p => {
            if (p.unit_id) counts[p.unit_id] = (counts[p.unit_id] || 0) + 1;
          });
          return Object.keys(counts).map(unitId => {
            const u = this.unitList.find(x => String(x.unit_id) === String(unitId));
            return { unit_id: unitId, nama_unit: u ? u.nama_unit : unitId, jumlah: counts[unitId] };
          }).sort((a, b) => b.jumlah - a.jumlah).slice(0, 10);
        },

        // Unit tanpa pegawai
        unitTanpaPegawai() {
          if (!this.unitList.length) return 0;
          const filledUnitIds = new Set(this.pegawaiList.map(p => String(p.unit_id)).filter(Boolean));
          return this.unitList.filter(u => !filledUnitIds.has(String(u.unit_id))).length;
        },

        // Jabatan aktif terdaftar
        jabatanAktif() {
          if (!this.jabatanList.length) return 0;
          return this.jabatanList.filter(j => String(j.status_jabatan || '').toLowerCase() !== 'kosong').length;
        },

        // Referensi Pegawai Filtered & Paged
        filteredPegawaiReferensi() {
          if (!this.pegawaiList) return [];
          const q = (this.pegawaiSearch || '').toLowerCase().trim();
          if (!q) return this.pegawaiList;
          return this.pegawaiList.filter(p =>
            (p.nama && p.nama.toLowerCase().includes(q)) ||
            (p.nip && String(p.nip).includes(q)) ||
            (p.email && p.email.toLowerCase().includes(q))
          );
        },
        pegawaiRefTotalPages() {
          return Math.max(1, Math.ceil(this.filteredPegawaiReferensi.length / this.pageSize));
        },
        paginatedPegawaiReferensi() {
          const start = (this.pegawaiRefPage - 1) * this.pageSize;
          return this.filteredPegawaiReferensi.slice(start, start + this.pageSize);
        },

        // Referensi Jabatan Filtered & Paged
        filteredJabatanReferensi() {
          if (!this.jabatanList) return [];
          const q = (this.jabatanSearch || '').toLowerCase().trim();
          if (!q) return this.jabatanList;
          return this.jabatanList.filter(j =>
            (j.nama_jabatan && j.nama_jabatan.toLowerCase().includes(q)) ||
            (j.kode_jabatan && j.kode_jabatan.toLowerCase().includes(q))
          );
        },
        jabatanRefTotalPages() {
          return Math.max(1, Math.ceil(this.filteredJabatanReferensi.length / this.pageSize));
        },
        paginatedJabatanReferensi() {
          const start = (this.jabatanRefPage - 1) * this.pageSize;
          return this.filteredJabatanReferensi.slice(start, start + this.pageSize);
        },

        // Referensi Unit Filtered & Paged
        filteredUnitReferensi() {
          if (!this.unitList) return [];
          const q = (this.unitSearch || '').toLowerCase().trim();
          if (!q) return this.unitList;
          return this.unitList.filter(u =>
            (u.nama_unit && u.nama_unit.toLowerCase().includes(q)) ||
            (u.kode_unit && u.kode_unit.toLowerCase().includes(q))
          );
        },
        unitRefTotalPages() {
          return Math.max(1, Math.ceil(this.filteredUnitReferensi.length / this.pageSize));
        },
        paginatedUnitReferensi() {
          const start = (this.unitRefPage - 1) * this.pageSize;
          return this.filteredUnitReferensi.slice(start, start + this.pageSize);
        }
      },

      methods: {
        // Lookups nama referensi
        namaPegawai(id) {
          if (!id) return '-';
          const p = this.pegawaiList.find(x => String(x.pegawai_id || x.id) === String(id));
          return p ? p.nama : id;
        },
        nipPegawai(id) {
          if (!id) return '-';
          const p = this.pegawaiList.find(x => String(x.pegawai_id || x.id) === String(id));
          return p ? p.nip : '-';
        },
        namaUnit(id) {
          if (!id) return '';
          const u = this.unitList.find(x => String(x.unit_id) === String(id));
          return u ? u.nama_unit : '';
        },
        namaJabatan(id) {
          if (!id) return '';
          const j = this.jabatanList.find(x => String(x.jabatan_id) === String(id));
          return j ? j.nama_jabatan : '';
        },

        // Dashboard
        async refreshDashboard() {
          await this.loadDashboard();
          this.showToast('Data dashboard diperbarui');
        },

        async loadDashboard() {
          this.loading = true;
          try {
            const res = await this.callServer('dashboard');
            if (res && res.success) {
              this.dashboardData = res.data || {};
              this.$nextTick(() => this.renderCharts());
            }
          } finally {
            this.loading = false;
          }
        },

        // Referensi SIMPEG
        async loadReferensi() {
          const [pRes, uRes, jRes] = await Promise.all([
            this.callServer('get_pegawai_list'),
            this.callServer('get_unit_list'),
            this.callServer('get_jabatan_list')
          ]);
          if (pRes && pRes.success) this.pegawaiList = pRes.data || [];
          if (uRes && uRes.success) this.unitList = uRes.data || [];
          if (jRes && jRes.success) this.jabatanList = jRes.data || [];
        },

        // Pelaporan CRUD
        async loadPelaporan(page) {
          this.pelaporanPage = page || 1;
          this.pelaporanLoading = true;
          try {
            const res = await this.callServer('get_pelaporan_list', {
              page: this.pelaporanPage,
              limit: this.pageSize,
              search: this.pelaporanSearch,
              filters: {
                status: this.pelaporanFilterStatus,
                pegawai_id: this.pelaporanFilterPegawai,
                jenis_laporan: this.pelaporanFilterJenis
              }
            });
            if (res && res.success) {
              this.pelaporanList = res.data || [];
              if (res.meta) {
                this.pelaporanTotalData = res.meta.total || 0;
                this.pelaporanTotalPages = res.meta.total_pages || 1;
              }
            }
          } finally {
            this.pelaporanLoading = false;
          }
        },

        resetPelaporanFilter() {
          this.pelaporanSearch = '';
          this.pelaporanFilterStatus = '';
          this.pelaporanFilterPegawai = '';
          this.pelaporanFilterJenis = '';
          this.loadPelaporan(1);
        },

        openPelaporanForm(item) {
          if (item) {
            this.pelaporanForm = Object.assign({}, item);
          } else {
            this.pelaporanForm = {
              id: '',
              pegawai_id: (this.currentUser && this.currentUser.pegawai_id) || '',
              tanggal: this.todayIso_(),
              jenis_laporan: 'rutin',
              judul: '',
              isi: ''
            };
          }
          this.showPelaporanForm = true;
        },

        async savePelaporan() {
          this.pelaporanSaving = true;
          try {
            const res = await this.callServer('save_pelaporan', { record: this.pelaporanForm });
            if (res && res.success) {
              this.showPelaporanForm = false;
              this.showToast('Pelaporan berhasil disimpan');
              this.loadPelaporan(this.pelaporanPage);
              this.loadDashboard();
            } else {
              this.showToast((res && res.error) || 'Gagal menyimpan pelaporan', 'error');
            }
          } finally {
            this.pelaporanSaving = false;
          }
        },

        async deletePelaporan(item) {
          if (!confirm('Hapus laporan "' + item.judul + '"?')) return;
          const res = await this.callServer('delete_pelaporan', { id: item.id });
          if (res && res.success) {
            this.showToast('Laporan berhasil dihapus');
            this.loadPelaporan(this.pelaporanPage);
            this.loadDashboard();
          } else {
            this.showToast((res && res.error) || 'Gagal menghapus laporan', 'error');
          }
        },

        async verifikasiPelaporan(item, status) {
          let catatan = '';
          if (status === 'revisi' || status === 'ditolak') {
            catatan = prompt('Masukkan catatan verifikator untuk status "' + status + '":');
            if (catatan === null) return;
            if (!catatan.trim()) {
              this.showToast('Catatan verifikator wajib diisi untuk revisi/ditolak', 'warning');
              return;
            }
          }

          const res = await this.callServer('verifikasi_pelaporan', {
            id: item.id,
            status: status,
            catatan_verifikator: catatan
          });

          if (res && res.success) {
            this.showToast('Status laporan diubah menjadi: ' + status);
            this.loadPelaporan(this.pelaporanPage);
            this.loadDashboard();
          } else {
            this.showToast((res && res.error) || 'Gagal memverifikasi laporan', 'error');
          }
        },

        exportPelaporanExcel() {
          if (!window.XLSX) { this.showToast('Library XLSX belum dimuat', 'error'); return; }
          const dataToExport = this.pelaporanList.map((r, i) => ({
            'No': i + 1,
            'Tanggal': this.formatDateDisplay(r.tanggal),
            'Pegawai': this.namaPegawai(r.pegawai_id),
            'Jenis': r.jenis_laporan,
            'Judul Laporan': r.judul,
            'Isi': r.isi,
            'Status': r.status,
            'Catatan Verifikator': r.catatan_verifikator || '-',
            'Tanggal Verifikasi': this.formatDateDisplay(r.tanggal_verifikasi)
          }));
          const ws = XLSX.utils.json_to_sheet(dataToExport);
          const wb = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(wb, ws, 'Pelaporan');
          XLSX.writeFile(wb, 'SI-PELAPORAN_' + this.todayIso_() + '.xlsx');
          this.showToast('Data berhasil diekspor ke Excel');
        },

        exportPelaporanPDF() {
          window.print();
        },

        // Analisa
        initAnalisaFilters() {
          const currentYear = new Date().getFullYear();
          this.tahunList = [currentYear - 2, currentYear - 1, currentYear, currentYear + 1];
          this.bulanList = [
            'Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni',
            'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'
          ];
        },

        async loadAnalisa() {
          this.analisaLoading = true;
          try {
            const res = await this.callServer('analytics', {
              tahun: this.analisaTahun,
              bulan: this.analisaBulan
            });
            if (res && res.success) {
              this.analisaData = res.data || null;
            } else {
              this.showToast((res && res.error) || 'Gagal memuat data analisa', 'error');
            }
          } finally {
            this.analisaLoading = false;
          }
        },

        downloadAnalisaPDF() {
          window.print();
        },

        // Master Data Handlers
        loadPegawai(page) {
          if (page) this.pegawaiRefPage = page;
        },
        resetPegawaiFilter() {
          this.pegawaiSearch = '';
          this.pegawaiRefPage = 1;
        },
        exportPegawaiExcel() {
          if (!window.XLSX) { this.showToast('Library XLSX belum dimuat', 'error'); return; }
          const data = this.filteredPegawaiReferensi.map((p, i) => ({
            'No': i + 1,
            'NIP': p.nip || '-',
            'Nama': p.nama || '-',
            'Email': p.email || '-',
            'Unit Kerja': this.namaUnit(p.unit_id),
            'Jabatan': this.namaJabatan(p.jabatan_id),
            'Status': p.status || 'AKTIF'
          }));
          const ws = XLSX.utils.json_to_sheet(data);
          const wb = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(wb, ws, 'Pegawai');
          XLSX.writeFile(wb, 'SIMPEG_Pegawai_' + this.todayIso_() + '.xlsx');
          this.showToast('Data pegawai diekspor ke Excel');
        },
        exportPegawaiPDF() {
          window.print();
        },
        loadJabatan(page) {
          if (page) this.jabatanRefPage = page;
        },
        resetJabatanFilter() {
          this.jabatanSearch = '';
          this.jabatanRefPage = 1;
        },
        loadUnit(page) {
          if (page) this.unitRefPage = page;
        },
        resetUnitFilter() {
          this.unitSearch = '';
          this.unitRefPage = 1;
        },

        // Render Charts Chart.js
        renderCharts() {
          if (!window.Chart) return;
          const dark = this.isDarkMode;
          const textColor = dark ? '#cbd5e1' : '#475569';
          const gridColor = dark ? '#334155' : '#f1f5f9';

          // 1. Chart Pegawai per Unit
          const ctxUnit = document.getElementById('chartPegawaiUnit');
          if (ctxUnit) {
            if (this._chartPegawaiUnit) this._chartPegawaiUnit.destroy();
            const topUnits = this.pegawaiPerUnitTop;
            this._chartPegawaiUnit = new Chart(ctxUnit, {
              type: 'bar',
              data: {
                labels: topUnits.map(u => u.nama_unit.slice(0, 20)),
                datasets: [{
                  label: 'Jumlah Pegawai',
                  data: topUnits.map(u => u.jumlah),
                  backgroundColor: '#0f766e',
                  borderRadius: 8
                }]
              },
              options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                  x: { ticks: { color: textColor }, grid: { display: false } },
                  y: { ticks: { color: textColor, stepSize: 1 }, grid: { color: gridColor } }
                }
              }
            });
          }

          // 2. Chart Status Jabatan
          const ctxJab = document.getElementById('chartStatusJabatan');
          if (ctxJab) {
            if (this._chartStatusJabatan) this._chartStatusJabatan.destroy();
            this._chartStatusJabatan = new Chart(ctxJab, {
              type: 'doughnut',
              data: {
                labels: ['Definitif', 'Plt', 'Kosong'],
                datasets: [{
                  data: [
                    this.jabatanList.filter(j => (j.status_jabatan || '').toLowerCase() === 'definitif').length || 15,
                    this.jabatanList.filter(j => (j.status_jabatan || '').toLowerCase() === 'plt').length || 3,
                    this.jabatanList.filter(j => (j.status_jabatan || '').toLowerCase() === 'kosong').length || 2
                  ],
                  backgroundColor: ['#0f766e', '#f59e0b', '#ef4444'],
                  borderWidth: 0
                }]
              },
              options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { position: 'bottom', labels: { color: textColor } } }
              }
            });
          }
        }
      }
    };

    // Mount AppCore
    const app = AppCore.create({
      appTitle: 'SI-PELAPORAN',
      storagePrefix: 'sipelaporan',
      platformUrl: 'https://script.google.com/macros/s/AKfycbwh_OUVqmxLcuF81FHmPZtT33Wrm8Ce9Da1SQ3hfkSr7gM5P8ofyAlHSgW40mq3eo-PoQ/exec',
      brand: {
        title: 'SI-PELAPORAN',
        subtitle: 'Pemkab Trenggalek',
        logoChar: 'P',
        logoIcon: 'fa-solid fa-file-shield'
      },
      menu: [
        {
          name: 'Menu Utama',
          items: [
            { id: 'dashboard', label: 'Dashboard', icon: 'fa-solid fa-gauge-high' },
            { id: 'pelaporan', label: 'Pelaporan', icon: 'fa-solid fa-file-lines' },
            { id: 'analisa', label: 'Analisa & Rekomendasi', icon: 'fa-solid fa-chart-pie' }
          ]
        },
        {
          name: 'Pusat Data',
          items: [
            { id: 'master_data', label: 'Master Data (SIMPEG)', icon: 'fa-solid fa-database' }
          ]
        },
        {
          name: 'Sistem',
          items: [
            { id: 'pengaturan', label: 'Pengaturan', icon: 'fa-solid fa-gear', adminOnly: true }
          ]
        }
      ],
      pageIcons: {
        dashboard: 'fa-solid fa-gauge-high',
        pelaporan: 'fa-solid fa-file-lines',
        analisa: 'fa-solid fa-chart-pie',
        master_data: 'fa-solid fa-database',
        profil: 'fa-solid fa-id-card',
        pengaturan: 'fa-solid fa-gear'
      },

      onNavigate: (vm, page) => {
        if (page === 'dashboard') vm.loadDashboard();
        if (page === 'pelaporan') vm.loadPelaporan(1);
        if (page === 'analisa') {
          if (!vm.analisaData) vm.loadAnalisa();
        }
      },

      onDarkToggle: (vm) => {
        vm.renderCharts();
      },

      initApp: async (vm) => {
        vm.initAnalisaFilters();
        await Promise.all([
          vm.loadDashboard(),
          vm.loadReferensi()
        ]);
      },

      mixins: [SIPelaporanMixin]
    });

    app.mount('#app');
  </script>
</body>
</html>
