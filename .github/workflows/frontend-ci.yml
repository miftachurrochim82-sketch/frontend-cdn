name: Frontend CDN CI

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "tools/build.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/frontend-ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "frontend/**"
      - "tools/build.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/frontend-ci.yml"

jobs:
  build:
    name: Verifikasi artefak CDN
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Membangun ulang bundel lalu membandingkannya dengan yang
      # di-commit. Gagal kalau artefak basi, tidak diminify, atau
      # versinya tertinggal dari package.json.
      - name: Verifikasi artefak sinkron dengan sumber
        run: npm run check

      - name: Syntax check bundel JS
        run: node --check frontend/app.min.js
