name: Frontend CDN CI

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "tools/build.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/frontend-ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "frontend/**"
      - "tools/build.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/frontend-ci.yml"

jobs:
  build:
    name: Verifikasi artefak CDN
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Membangun ulang artefak lalu membandingkannya dengan yang
      # di-commit. Gagal kalau ada .min yang basi atau tidak diminify.
      #
      # Ini inti perbaikan Batch 1: sebelumnya CI hanya menjalankan build
      # dan membuang hasilnya, sehingga selalu hijau meski 8 dari 9
      # artefak .min sebenarnya hanya salinan mentah sumbernya.
      - name: Verifikasi artefak .min sinkron dengan sumber
        run: npm run check

      - name: Syntax check artefak JS
        run: |
          for f in frontend/*.min.js; do
            node --check "$f" || exit 1
          done
          echo "Semua artefak JS valid."
