name: Deploy Backend to Google Apps Script (CI/CD)

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.clasp.json'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install Google Clasp
        run: npm install -g @google/clasp

      - name: 🔑 Setup Clasp Authentication
        run: |
          echo "$CLASPRC_JSON" > ~/.clasprc.json
          chmod 600 ~/.clasprc.json
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}

      - name: 🔍 Verify Clasp Login
        run: clasp login --status || (echo "❌ Clasp auth failed" && exit 1)

      - name: ⚙️ Setup Target Script ID
        if: env.CLASP_SCRIPT_ID != ''
        run: |
          node -e "
            const fs = require('fs');
            const clasp = JSON.parse(fs.readFileSync('.clasp.json', 'utf8'));
            clasp.scriptId = process.env.CLASP_SCRIPT_ID;
            fs.writeFileSync('.clasp.json', JSON.stringify(clasp, null, 2));
          "
        env:
          CLASP_SCRIPT_ID: ${{ secrets.CLASP_SCRIPT_ID }}

      - name: ✅ Validate scriptId
        run: |
          node -e "
            const c = require('./.clasp.json');
            if (!c.scriptId || c.scriptId.length < 20) {
              console.error('❌ scriptId tidak valid:', c.scriptId);
              process.exit(1);
            }
            console.log('✅ scriptId valid:', c.scriptId.slice(0, 15) + '...');
          "

      - name: 🚀 Push Backend Code to Google Apps Script
        run: clasp push --force

      - name: 📦 Deploy New Version (Optional)
        if: success()
        run: |
          VERSION=$(date +%Y%m%d-%H%M)
          clasp deploy --description "Auto-deploy $VERSION from GitHub Actions"
